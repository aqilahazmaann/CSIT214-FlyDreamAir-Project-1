<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyDreamAir - My Reservations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blurple: '#4F46E5',
                        safetyOrange: '#F97316'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen pb-28">

    <header class="bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between sticky top-0 z-40 shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="bg-blurple text-white p-2 rounded-xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform rotate-45" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </div>
            <span class="font-bold text-gray-900 tracking-tight text-lg">FLY DREAM</span>
        </div>
        <div class="flex items-center space-x-3">
            <div class="text-right">
                <div class="text-[9px] font-bold text-blurple tracking-widest uppercase">PREMIUM MEMBER</div>
                <div id="header-username" class="text-xs font-semibold text-gray-800">John Traveler</div>
            </div>
            <div id="header-initials" class="h-9 w-9 bg-blurple/10 text-blurple rounded-xl flex items-center justify-center font-bold text-sm">JT</div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-10">
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Your Reservations</h1>
            <p class="text-xs text-gray-400 font-medium mt-1">Manage your upcoming journeys and explore details.</p>
        </div>

        <section class="bg-white border border-gray-100 rounded-3xl p-6 shadow-sm mb-8">
            <h3 class="text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-6">Journey Timeline</h3>
            <div class="relative flex items-center justify-between max-w-xl mx-auto px-4">
                <div class="absolute inset-x-0 h-0.5 bg-gray-200 top-5 z-0"></div>
                
                <div class="z-10 text-center flex flex-col items-center">
                    <div class="h-10 w-10 bg-blurple text-white rounded-full flex items-center justify-center shadow-lg shadow-indigo-100 font-bold text-xs">
                        ✈️
                    </div>
                    <div class="text-xs font-bold text-gray-900 mt-2" id="timeline-origin">LHR</div>
                    <div class="text-[9px] text-gray-400 font-medium uppercase tracking-wider mt-0.5">Origin</div>
                </div>

                <div class="z-10 text-center flex flex-col items-center">
                    <div class="h-10 w-10 bg-safetyOrange text-white rounded-full flex items-center justify-center shadow-lg shadow-orange-100 font-bold text-xs">
                        🛬
                    </div>
                    <div class="text-xs font-bold text-gray-900 mt-2" id="timeline-destination">CDG</div>
                    <div class="text-[9px] text-gray-400 font-medium uppercase tracking-wider mt-0.5">Destination</div>
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <h3 class="text-xs font-bold text-gray-400 tracking-widest uppercase mb-2">Active Flight Bookings</h3>
            <div id="reservations-target-stack" class="space-y-4">
                </div>
        </section>
    </main>

    <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-md px-4">
        <nav class="bg-gray-900/90 backdrop-blur-lg border border-white/10 shadow-2xl rounded-2xl py-3 px-6 flex items-center justify-between text-white text-xs font-semibold tracking-wide uppercase">
            <button onclick="handleNav('book')" class="flex items-center space-x-2 text-gray-400 hover:text-white transition-colors pb-1 px-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                <span>Book Flight</span>
            </button>
            <button onclick="handleNav('reservations')" class="flex items-center space-x-2 text-blurple border-b-2 border-blurple pb-1 px-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 002-2H3a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                <span>Reservations</span>
            </button>
            <button onclick="handleNav('services')" class="flex items-center space-x-2 text-gray-400 hover:text-white transition-colors pb-1 px-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                <span>Services</span>
            </button>
        </nav>
    </div>

    <script>
        let currentReservations = [];

        window.onload = function() {
            // Identity Initialization
            const fName = localStorage.getItem('loggedUserFirstName') || "John";
            const lName = localStorage.getItem('loggedUserLastName') || "Traveler";
            document.getElementById('header-username').innerText = `${fName} ${lName}`;
            document.getElementById('header-initials').innerText = `${fName.charAt(0)}${lName.charAt(0)}`.toUpperCase();

            // Load and Parse the Global Reservations JSON array
            currentReservations = JSON.parse(localStorage.getItem('globalReservationsDatabase') || "[]");

            // Fallback seed object to populate layout automatically if accessed standalone
            if (currentReservations.length === 0) {
                currentReservations.push({
                    id: "FDA-202",
                    origin: "LHR",
                    destination: "CDG",
                    date: "Dec 12, 2026",
                    time: "09:45 AM",
                    seat: "3A",
                    reference: "#RES-1029",
                    status: "CONFIRMED"
                });
                localStorage.setItem('globalReservationsDatabase', JSON.stringify(currentReservations));
            }

            // Sync visual header maps to the most recent ticket index record
            const primaryTrack = currentReservations[currentReservations.length - 1];
            document.getElementById('timeline-origin').innerText = primaryTrack.origin;
            document.getElementById('timeline-destination').innerText = primaryTrack.destination;

            renderTicketStack();
        }

        // Parse and render HTML array blocks
        function renderTicketStack() {
            const targetStack = document.getElementById('reservations-target-stack');
            targetStack.innerHTML = "";

            currentReservations.forEach((ticket, index) => {
                const card = document.createElement('div');
                card.className = "bg-white border border-gray-100 rounded-3xl p-6 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center relative gap-6";
                
                // Set color maps for status pill variations
                const statusColor = ticket.status === 'CONFIRMED' ? 'bg-indigo-50 text-blurple' : 'bg-amber-50 text-amber-600';

                card.innerHTML = `
                    <div class="flex flex-col md:flex-row items-stretch gap-6 w-full sm:w-auto">
                        <div class="w-full md:w-24 h-24 bg-gray-100 rounded-2xl overflow-hidden relative hidden md:block">
                            <img src="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=200&q=80" class="w-full h-full object-cover">
                        </div>
                        
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-x-8 gap-y-2 text-left">
                            <div>
                                <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Departure</div>
                                <div class="text-base font-extrabold text-gray-900">${ticket.origin}</div>
                            </div>
                            <div>
                                <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Arrival</div>
                                <div class="text-base font-extrabold text-gray-900">${ticket.destination}</div>
                            </div>
                            <div>
                                <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Date & Time</div>
                                <div class="text-xs font-bold text-gray-800 mt-1">${ticket.date}</div>
                                <div class="text-[10px] text-gray-400 font-medium">${ticket.time}</div>
                            </div>
                            <div>
                                <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Seat Allocation</div>
                                <div class="text-sm font-extrabold text-gray-900 mt-0.5">${ticket.seat}</div>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-row sm:flex-col items-end justify-between sm:justify-center w-full sm:w-auto border-t sm:border-t-0 pt-4 sm:pt-0 border-gray-50 gap-4">
                        <div class="text-right">
                            <span class="inline-block px-3 py-1 ${statusColor} font-black text-[9px] tracking-widest uppercase rounded-full">${ticket.status}</span>
                            <div class="text-[10px] font-mono text-gray-400 mt-1.5 font-bold">${ticket.reference}</div>
                        </div>
                        
                        <div class="flex space-x-2">
                            <button onclick="modifyReservationAction(${index})" class="text-gray-400 hover:text-blurple transition-all text-sm p-1" title="Modify Itinerary">✏️</button>
                            <button onclick="cancelReservationAction(${index})" class="text-gray-400 hover:text-red-500 transition-all text-sm p-1" title="Cancel Booking">🗑️</button>
                        </div>
                    </div>
                `;
                targetStack.appendChild(card);
            });
        }

        // Action 1: Modify Data Attributes (FR-04 Simulation)
        function modifyReservationAction(index) {
            const currentSeat = currentReservations[index].seat;
            const newSeat = prompt(`Enter new seat identifier to alter reservation metadata mapping (Current: ${currentSeat}):`, currentSeat);
            
            if (newSeat && newSeat.trim() !== "" && newSeat !== currentSeat) {
                currentReservations[index].seat = newSeat.trim().toUpperCase();
                currentReservations[index].status = "PENDING"; // Switches state to signify alteration request in timeline
                localStorage.setItem('globalReservationsDatabase', JSON.stringify(currentReservations));
                renderTicketStack();
                alert("Reservation record modified in memory stack. Status set to PENDING pending clearance verification.");
            }
        }

        // Action 2: Delete Data Elements (FR-04 Simulation)
        function cancelReservationAction(index) {
            const confirmation = confirm(`Are you sure you want to authorize cancellation for itinerary reference code: ${currentReservations[index].reference}?`);
            if (confirmation) {
                currentReservations.splice(index, 1);
                localStorage.setItem('globalReservationsDatabase', JSON.stringify(currentReservations));
                renderTicketStack();
                alert("Itinerary purged from transactional application state memory array arrays successfully.");
            }
        }

        function handleNav(tab) {
            if (tab === 'book') window.location.href = 'dashboard.html';
            if (tab === 'services') window.location.href = 'booking-assets.html';
        }
    </script>
</body>
</html>
