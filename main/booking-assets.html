<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyDreamAir - Seat & Ancillary Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blurple: '#4F46E5',
                        safetyOrange: '#F97316'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen pb-28">

    <header class="bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between sticky top-0 z-40 shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="bg-blurple text-white p-2 rounded-xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform rotate-45" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </div>
            <span class="font-bold text-gray-900 tracking-tight text-lg">FLY DREAM</span>
        </div>
        <div class="flex items-center space-x-3">
            <div class="text-right">
                <div class="text-[9px] font-bold text-blurple tracking-widest uppercase">PREMIUM MEMBER</div>
                <div id="header-username" class="text-xs font-semibold text-gray-800">John Traveler</div>
            </div>
            <div id="header-initials" class="h-9 w-9 bg-blurple/10 text-blurple rounded-xl flex items-center justify-center font-bold text-sm">JT</div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-8">
        <div class="flex space-x-4 mb-6 border-b border-gray-200 pb-3">
            <button id="tab-btn-seat" onclick="toggleSubView('seat')" class="text-sm font-bold border-b-2 border-blurple text-blurple pb-2 px-1 transition-all">01 Select Seats</button>
            <button id="tab-btn-services" onclick="toggleSubView('services')" class="text-sm font-bold text-gray-400 hover:text-gray-600 pb-2 px-1 transition-all">02 In-Flight Services</button>
        </div>

        <div id="sub-view-seat" class="flex flex-col lg:flex-row gap-8 items-start">
            <div class="w-full lg:flex-1 bg-white border border-gray-100 rounded-3xl p-6 shadow-sm flex flex-col items-center">
                <div class="w-32 h-12 border-t-2 border-x-2 border-gray-200 rounded-t-full mb-8 bg-gray-50 flex items-center justify-center text-[10px] uppercase font-bold tracking-widest text-gray-300">Cockpit</div>
                
                <div id="cabin-layout-grid" class="space-y-3 w-full max-w-sm">
                    </div>
            </div>

            <div class="w-full lg:w-80 space-y-4 sticky top-24">
                <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm">
                    <h3 class="text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-3">Legend</h3>
                    <div class="space-y-2 text-xs font-medium text-gray-600">
                        <div class="flex items-center space-x-3"><span class="w-4 h-4 rounded bg-gray-100 border border-gray-200 block"></span><span>Available</span></div>
                        <div class="flex items-center space-x-3"><span class="w-4 h-4 rounded bg-safetyOrange block"></span><span>Your Choice</span></div>
                        <div class="flex items-center space-x-3"><span class="w-4 h-4 rounded bg-gray-300 block"></span><span>Occupied</span></div>
                    </div>
                </div>

                <div class="bg-blurple text-white rounded-2xl p-5 shadow-lg shadow-indigo-100 flex flex-col justify-between">
                    <div>
                        <div class="text-[9px] font-bold text-indigo-200 tracking-widest uppercase">Selected Seat</div>
                        <div id="panel-seat-code" class="text-3xl font-black tracking-tight mt-1">None</div>
                    </div>
                    <div class="mt-6 pt-4 border-t border-white/10 flex justify-between items-baseline">
                        <span class="text-[10px] text-indigo-200 font-bold uppercase tracking-wider">Premium Cost</span>
                        <span id="panel-seat-price" class="text-xl font-bold">$0.00</span>
                    </div>
                </div>

                <button onclick="toggleSubView('services')" class="w-full bg-white text-gray-800 border border-gray-200 hover:border-blurple font-semibold py-3 px-4 rounded-xl text-xs uppercase tracking-wider shadow-sm transition-all text-center block">
                    Continue to Services &rarr;
                </button>
            </div>
        </div>

        <div id="sub-view-services" class="hidden flex flex-col lg:flex-row gap-8 items-start">
            <div class="w-full lg:flex-1 space-y-6">
                <div class="flex space-x-2">
                    <button class="px-4 py-1.5 bg-gray-900 text-white font-bold text-[10px] tracking-wider uppercase rounded-full shadow-sm">All</button>
                    <button class="px-4 py-1.5 bg-white border border-gray-100 text-gray-500 font-bold text-[10px] tracking-wider uppercase rounded-full hover:bg-gray-50">Meals</button>
                    <button class="px-4 py-1.5 bg-white border border-gray-100 text-gray-500 font-bold text-[10px] tracking-wider uppercase rounded-full hover:bg-gray-50">Drinks</button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="bg-white rounded-3xl overflow-hidden border border-gray-100 shadow-sm flex flex-col justify-between p-4">
                        <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=300&q=80" alt="Gourmet Pasta" class="w-full h-32 object-cover rounded-2xl mb-3">
                        <div>
                            <h4 class="font-bold text-gray-800 text-sm tracking-tight">Gourmet Pasta</h4>
                            <div class="flex items-center justify-between mt-3">
                                <span class="font-extrabold text-gray-900 text-sm">$15.00</span>
                                <button onclick="addAncillaryItem('Gourmet Pasta', 15.00)" class="h-7 w-7 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center font-bold text-gray-500 hover:bg-blurple hover:text-white transition-all">+</button>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-3xl overflow-hidden border border-gray-100 shadow-sm flex flex-col justify-between p-4">
                        <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=300&q=80" alt="Garden Salad" class="w-full h-32 object-cover rounded-2xl mb-3">
                        <div>
                            <h4 class="font-bold text-gray-800 text-sm tracking-tight">Garden Salad</h4>
                            <div class="flex items-center justify-between mt-3">
                                <span class="font-extrabold text-gray-900 text-sm">$12.00</span>
                                <button onclick="addAncillaryItem('Garden Salad', 12.00)" class="h-7 w-7 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center font-bold text-gray-500 hover:bg-blurple hover:text-white transition-all">+</button>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-3xl overflow-hidden border border-gray-100 shadow-sm flex flex-col justify-between p-4">
                        <img src="https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?auto=format&fit=crop&w=300&q=80" alt="Red Wine" class="w-full h-32 object-cover rounded-2xl mb-3">
                        <div>
                            <h4 class="font-bold text-gray-800 text-sm tracking-tight">Red Wine (Mini)</h4>
                            <div class="flex items-center justify-between mt-3">
                                <span class="font-extrabold text-gray-900 text-sm">$15.00</span>
                                <button onclick="addAncillaryItem('Red Wine (Mini)', 15.00)" class="h-7 w-7 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center font-bold text-gray-500 hover:bg-blurple hover:text-white transition-all">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="w-full lg:w-80 bg-white border border-gray-100 rounded-3xl p-6 shadow-sm space-y-4 sticky top-24">
                <h3 class="text-xs font-bold text-gray-400 tracking-widest uppercase border-b border-gray-50 pb-2">Selected Services</h3>
                <div id="services-cart-list" class="space-y-2 text-xs font-semibold text-gray-600">
                    <p class="text-gray-300 font-normal italic text-center py-4">No ancillary services added yet.</p>
                </div>
                <div class="pt-3 border-t border-gray-100 flex justify-between items-baseline">
                    <span class="text-xs font-bold text-gray-400 uppercase">Cart Total</span>
                    <span id="services-cart-total" class="text-lg font-black text-gray-900">$0.00</span>
                </div>
                <button onclick="commitSelectionWorkflow()" class="w-full bg-safetyOrange hover:bg-orange-600 text-white font-bold py-3.5 px-4 rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-orange-100 text-center block transition-all">
                    Proceed to Payment &rarr;
                </button>
            </div>
        </div>
    </main>

    <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-md px-4">
        <nav class="bg-gray-900/90 backdrop-blur-lg border border-white/10 shadow-2xl rounded-2xl py-3 px-6 flex items-center justify-between text-white text-xs font-semibold tracking-wide uppercase">
            <button class="flex items-center space-x-2 text-blurple border-b-2 border-blurple pb-1 px-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                <span>Book Flight</span>
            </button>
            <button class="flex items-center space-x-2 text-gray-400 hover:text-white transition-colors pb-1 px-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 002-2H3a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                <span>Reservations</span>
            </button>
            <button class="flex items-center space-x-2 text-gray-400 hover:text-white transition-colors pb-1 px-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                <span>Services</span>
            </button>
        </nav>
    </div>

    <script>
        // App State Structs
        let chosenSeatCode = "";
        let chosenSeatPrice = 0.00;
        const chosenServices = [];

        // Dynamic Initialization Motor mapping names and initial rows
        window.onload = function() {
            // Existing identity assignment code remains the same...
            const fName = localStorage.getItem('loggedUserFirstName') || "John";
            const lName = localStorage.getItem('loggedUserLastName') || "Traveler";
            document.getElementById('header-username').innerText = `${fName} ${lName}`;
            document.getElementById('header-initials').innerText = `${fName.charAt(0)}${lName.charAt(0)}`.toUpperCase();

            // OPTIONAL: Read selected flight details from storage if needed for display purposes
            const activeFlightId = localStorage.getItem('checkoutFlightId') || "FDA-101";

            // Cabin layout generation loop remains exactly the same...
            const gridTarget = document.getElementById('cabin-layout-grid');
            const occupiedMockList = ["1B", "2C", "4A", "7D", "8B"];

            for(let i = 1; i <= 10; i++) {
                // ... (Keep the exact same row generation loop code here) ...
                const rowDiv = document.createElement('div');
                rowDiv.className = "flex items-center justify-between space-x-2";
                const leftSide = document.createElement('div');
            leftSide.className = "flex space-x-2 flex-1 justify-end";
                ['A', 'B'].forEach(letter => leftSide.appendChild(createSeatElement(`${i}${letter}`, occupiedMockList)));
                const centerRowNumber = document.createElement('div');
                centerRowNumber.className = "w-8 text-center text-[10px] font-bold text-gray-300";
                centerRowNumber.innerText = String(i).padStart(2, '0');
                const rightSide = document.createElement('div');
                rightSide.className = "flex space-x-2 flex-1 justify-start";
                ['C', 'D'].forEach(letter => rightSide.appendChild(createSeatElement(`${i}${letter}`, occupiedMockList)));
                rowDiv.appendChild(leftSide);
                rowDiv.appendChild(centerRowNumber);
                rowDiv.appendChild(rightSide);
                gridTarget.appendChild(rowDiv);
            }
        }

        // Sub-Component Generator
        function createSeatElement(code, occupiedList) {
            const btn = document.createElement('button');
            btn.id = `seat-node-${code}`;
            btn.className = "w-10 h-10 rounded-xl font-bold text-[10px] border transition-all flex items-center justify-center ";
            btn.innerText = code;

            if (occupiedList.includes(code)) {
                btn.className += "bg-gray-200 text-gray-400 border-gray-300 cursor-not-allowed";
                btn.disabled = true;
            } else {
                btn.className += "bg-gray-50 border-gray-200 text-gray-700 hover:border-blurple";
                btn.onclick = () => selectSeatAction(code);
            }
            return btn;
        }

        // Handle interactive clicking configurations
        function selectSeatAction(code) {
            // Remove previous choice color mappings
            if(chosenSeatCode) {
                const prev = document.getElementById(`seat-node-${chosenSeatCode}`);
                if(prev) prev.className = "w-10 h-10 rounded-xl font-bold text-[10px] border border-gray-200 bg-gray-50 text-gray-700 hover:border-blurple";
            }

            chosenSeatCode = code;
            chosenSeatPrice = 12.00; // Flat pricing layout tier selection [cite: 308]

            // Mark active layout color state
            const target = document.getElementById(`seat-node-${code}`);
            target.className = "w-10 h-10 rounded-xl font-bold text-[10px] bg-safetyOrange border-safetyOrange text-white";

            // Update state drawers
            document.getElementById('panel-seat-code').innerText = code;
            document.getElementById('panel-seat-price').innerText = `$${chosenSeatPrice.toFixed(2)}`;
        }

        // App Workspace View Changer Logic Engine
        function toggleSubView(target) {
            const viewSeat = document.getElementById('sub-view-seat');
            const viewServ = document.getElementById('sub-view-services');
            const btnSeat = document.getElementById('tab-btn-seat');
            const btnServ = document.getElementById('tab-btn-services');

            if(target === 'seat') {
                viewSeat.classList.remove('hidden');
                viewServ.classList.add('hidden');
                btnSeat.className = "text-sm font-bold border-b-2 border-blurple text-blurple pb-2 px-1 transition-all";
                btnServ.className = "text-sm font-bold text-gray-400 hover:text-gray-600 pb-2 px-1 transition-all";
            } else {
                viewSeat.classList.add('hidden');
                viewServ.classList.remove('hidden');
                btnSeat.className = "text-sm font-bold text-gray-400 hover:text-gray-600 pb-2 px-1 transition-all";
                btnServ.className = "text-sm font-bold border-b-2 border-blurple text-blurple pb-2 px-1 transition-all";
            }
        }

        // Add item elements to cart data structure arrays
        function addAncillaryItem(name, price) {
            chosenServices.push({ name, price });
            renderServicesCart();
        }

        // Render functions parsing arrays dynamically
        function renderServicesCart() {
            const cartTarget = document.getElementById('services-cart-list');
            cartTarget.innerHTML = "";

            let sumTotal = 0;
            chosenServices.forEach((item, index) => {
                sumTotal += item.price;
                const row = document.createElement('div');
                row.className = "flex justify-between items-center bg-gray-50 p-2 rounded-xl border border-gray-100";
                row.innerHTML = `
                    <span class="text-gray-800">${item.name}</span>
                    <div class="flex items-center space-x-3">
                        <span class="text-gray-900 font-bold">$${item.price.toFixed(2)}</span>
                        <button onclick="removeAncillaryItem(${index})" class="text-red-400 hover:text-red-600 font-bold font-sans">&times;</button>
                    </div>
                `;
                cartTarget.appendChild(row);
            });

            if(chosenServices.length === 0) {
                cartTarget.innerHTML = `<p class="text-gray-300 font-normal italic text-center py-4">No ancillary services added yet.</p>`;
            }

            document.getElementById('services-cart-total').innerText = `$${sumTotal.toFixed(2)}`;
            localStorage.setItem('checkoutServicesSum', sumTotal.toFixed(2));
            localStorage.setItem('checkoutServicesJSON', JSON.stringify(chosenServices));
        }

        function removeAncillaryItem(index) {
            chosenServices.splice(index, 1);
            renderServicesCart();
        }

        // Commit and advance workflows down pipeline loops
        function commitSelectionWorkflow() {
            if(!chosenSeatCode) {
                alert("Please select an aircraft seat to proceed.");
                toggleSubView('seat');
                return;
            }

            // Lock values to cross-page shared states
            localStorage.setItem('checkoutSeatCode', chosenSeatCode);
            localStorage.setItem('checkoutSeatPrice', chosenSeatPrice.toFixed(2));

            // UPDATE THIS REDIRECTION TO LINK TO YOUR PAYMENT PAGE NATIVELY:
            window.location.href = 'payment.html';
        }
    </script>
</body>
</html>
